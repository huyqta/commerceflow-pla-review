# infra/docker/docker-compose.yml
# Cấu hình kiểm thử và khởi chạy cục bộ CommerceFlow với Health Probes
# Tách biệt Liveness (tiến trình sống) và Readiness (phụ thuộc DB / Broker sẵn sàng)

services:
  postgres:
    image: postgres:16-alpine
    container_name: commerceflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
      POSTGRES_DB: commerceflow_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api-gateway:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile
    container_name: commerceflow-gateway
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres_dev_password@postgres:5432/commerceflow_db
      JWT_SECRET: commerceflow_production_ready_jwt_secret_key_2026
      USE_STANDALONE_SERVICES: "true"
      CATALOG_SERVICE_URL: "http://catalog-service:3001"
      INVENTORY_SERVICE_URL: "http://inventory-service:3002"
      ORDER_SERVICE_URL: "http://order-service:3003"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      catalog-service:
        condition: service_started
      inventory-service:
        condition: service_started
      order-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/liveness"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  catalog-service:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile
    container_name: commerceflow-catalog
    command: ["node", "--experimental-strip-types", "apps/catalog-service/src/main.ts"]
    environment:
      PORT: 3001
      CATALOG_DATABASE_URL: postgresql://postgres:postgres_dev_password@postgres:5432/commerceflow_db
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  inventory-service:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile
    container_name: commerceflow-inventory
    command: ["node", "--experimental-strip-types", "apps/inventory-service/src/main.ts"]
    environment:
      PORT: 3002
      INVENTORY_DATABASE_URL: postgresql://postgres:postgres_dev_password@postgres:5432/commerceflow_db
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile
    container_name: commerceflow-order
    command: ["node", "--experimental-strip-types", "apps/order-service/src/main.ts"]
    environment:
      PORT: 3003
      ORDER_DATABASE_URL: postgresql://postgres:postgres_dev_password@postgres:5432/commerceflow_db
      CATALOG_SERVICE_URL: http://catalog-service:3001
      INVENTORY_SERVICE_URL: http://inventory-service:3002
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy

