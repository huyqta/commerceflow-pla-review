# infra/docker/docker-compose.yml
# Cấu hình kiểm thử và khởi chạy cục bộ CommerceFlow với Health Probes
# Tách biệt Liveness (tiến trình sống) và Readiness (phụ thuộc DB / Broker sẵn sàng)

services:
  postgres:
    image: postgres:16-alpine
    container_name: commerceflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
      POSTGRES_DB: commerceflow_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api-gateway:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile
    container_name: commerceflow-gateway
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres_dev_password@postgres:5432/commerceflow_db
      JWT_SECRET: commerceflow_production_ready_jwt_secret_key_2026
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/liveness"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

