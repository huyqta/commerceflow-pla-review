apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerceflow-api-gateway
  namespace: commerceflow
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: commerceflow
    app.kubernetes.io/component: gateway
    app.kubernetes.io/version: v1.2.2
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # Zero Downtime Deployment: Không bao giờ hạ số replicas sẵn sàng dưới ngưỡng chỉ định
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: commerceflow
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
      - name: api-gateway
        image: asia-southeast1-docker.pkg.dev/commerceflow-sandbox-dev/commerceflow-apps/api-gateway:v1.2.2
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: "3000"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: commerceflow-secrets
              key: jwt-secret
        # RESOURCE QUOTAS (REQUESTS & LIMITS): Tránh tình trạng Noisy Neighbor và OOMKilled
        resources:
          requests:
            cpu: 100m       # 0.1 CPU core cam kết tối thiểu
            memory: 128Mi   # 128MB RAM cam kết tối thiểu
          limits:
            cpu: 500m       # 0.5 CPU core trần
            memory: 256Mi   # 256MB RAM trần (ngăn ngừa Memory Leak đánh sập node)
        # READINESS PROBE: Thăm dò tính sẵn sàng xử lý traffic của dịch vụ
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
        # LIVENESS PROBE: Thăm dò tiến trình còn sống (Chỉ khởi động lại nếu tiến trình chết hoặc deadlock)
        livenessProbe:
          httpGet:
            path: /live
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: commerceflow
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: commerceflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: commerceflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: commerceflow-api-gateway
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70 # Tự động scale out khi CPU trung bình vượt quá 70%

